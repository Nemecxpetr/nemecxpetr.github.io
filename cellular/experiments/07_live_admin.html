<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lesson 07 · Live admin</title>
  <link rel="icon" type="image/png" href="../../favicon_1.png" />
  <meta name="robots" content="noindex" />
  <style>
    :root { --fg: #8f8; --dim: #5a5; --faint: #353; --bg: #000; --panel: #050a05; --warn: #f86; --cold: #9cf; --warm: #fc8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 13px monospace; padding: 12px 16px 40px; }
    h1 { font-size: 15px; margin: 0; font-weight: normal; }
    a { color: var(--fg); }
    button { font: 13px monospace; padding: 7px 10px; background: #111; color: var(--fg); border: 1px solid #484; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1a2a1a; }
    button.on { background: #1f3a1f; }
    button.danger { border-color: #844; }
    input[type=range] { width: 100%; accent-color: #6c6; }
    input[type=number] { font: 13px monospace; width: 70px; background: #111; color: var(--fg); border: 1px solid #484; border-radius: 4px; padding: 6px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .panel { background: var(--panel); border: 1px solid var(--faint); border-radius: 6px; padding: 12px; margin-top: 12px; }
    .muted { color: var(--dim); }
    .err { color: var(--warn); }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; align-items: center; }
    #dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #a44; margin-right: 6px; }
    #dot.ok { background: #4a4; }
    .big { font-size: 22px; }
    .master input[type=range] { height: 36px; }
    .scale { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; }
    .cold { color: var(--cold); } .warm { color: var(--warm); }
    .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 760px) { .roles { grid-template-columns: 1fr; } }
    .role h2 { font-size: 18px; margin: 0; font-weight: normal; }
    .preview { display: flex; gap: 12px; margin: 10px 0; }
    .preview canvas { height: 220px; aspect-ratio: 36 / 64; border: 1px solid var(--faint); image-rendering: pixelated; flex: none; }
    .readout { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .bar { height: 6px; background: #111; border-radius: 3px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cold), var(--warm)); }
    details { margin-top: 8px; }
    summary { cursor: pointer; color: var(--dim); }
    .param { display: grid; grid-template-columns: 80px 1fr 52px 22px; gap: 6px; align-items: center; margin: 4px 0; }
    .param .v { text-align: right; }
    .param.locked .k, .param.locked .v { color: var(--warm); }
    .param:not(.locked) input { opacity: 0.55; }
    .param button { padding: 2px 4px; font-size: 11px; }
    code { color: var(--fg); background: #111; padding: 1px 4px; border-radius: 3px; word-break: break-all; }
  </style>
</head>
<body>
<header>
  <h1>cellular · live admin</h1>
  <div class="row"><span id="dot"></span><span id="status">connecting…</span></div>
  <div class="row">players: <b>cosi <span id="n_cosi">0</span></b> · <b>čímsi <span id="n_cimsi">0</span></b></div>
  <div class="row" id="authBox"></div>
</header>
<div class="muted" id="links" style="margin-top:6px"></div>

<div class="panel master">
  <div class="row" style="justify-content:space-between">
    <span>progress <span class="big" id="masterVal">0.00</span></span>
    <label class="row"><input type="checkbox" id="linked" checked> linked (čímsi = 1 − cosi)</label>
  </div>
  <div id="masterBox">
    <input type="range" id="master" min="0" max="1" step="0.01" value="0">
    <div class="scale"><span>cosi <span class="cold">cold</span> · čímsi <span class="warm">warm</span></span><span>cosi <span class="warm">warm</span> · čímsi <span class="cold">cold</span></span></div>
    <div class="row" style="margin-top:8px" id="jumps"></div>
  </div>
  <div class="row" style="margin-top:10px">
    glide <input type="number" id="glide" min="0" step="1" value="0"> s
    <span id="glidePresets" class="row"></span>
    <span class="muted">— how long phones take to reach a new value</span>
  </div>
  <div class="row" style="margin-top:10px">
    <span class="muted">all:</span>
    <button data-all="run">run</button><button data-all="pause">pause</button>
    <button data-all="hold">hold glide</button>
    <button data-cmd="random" data-role="both">random</button>
    <button data-cmd="seed" data-role="both">ice seed</button>
    <button data-cmd="freeze" data-role="both">freeze</button>
    <button data-cmd="melt" data-role="both">melt</button>
    <button data-cmd="clear" data-role="both" class="danger">clear</button>
  </div>
</div>

<div class="roles" id="roles"></div>

<p class="muted" style="margin-top:16px">keys: space run/pause all · [ / ] progress −/+ 0.02 · h hold</p>

<script type="module">
import { createSim, paramsFor, phaseAt, PARAM_RANGES, clampParam } from './live/sim.js';
import { connect, ROLES, ROLE_LABEL } from './live/net.js';

const $ = id => document.getElementById(id);
const net = await connect();
net.becomeAdmin();

// ---- header: status, auth, player links ----------------------------------
net.on('status', s => { $('dot').classList.toggle('ok', s.ok); $('status').textContent = `${net.mode} · ${s.text}`; $('status').className = s.ok ? '' : 'err'; });
net.on('presence', c => { $('n_cosi').textContent = c.cosi; $('n_cimsi').textContent = c.cimsi; });

const playerUrl = new URL('07_live.html' + location.search, location.href).href;
$('links').innerHTML = `player page: <a href="${playerUrl}" target="_blank">${playerUrl}</a>` +
  ` · direct: <a href="${playerUrl}#cosi" target="_blank">#cosi</a> <a href="${playerUrl}#cimsi" target="_blank">#cimsi</a>` +
  (net.mode === 'local' ? ' <span class="muted">(local mode: open players as tabs in this browser)</span>' : '');

if (net.mode === 'firebase') {
  net.on('auth', u => {
    const box = $('authBox'); box.innerHTML = '';
    if (!u) { const b = btn('sign in (admin)', () => net.signIn()); box.append(b); return; }
    const s = document.createElement('span');
    s.innerHTML = `signed in · uid <code>${u.uid}</code>`;
    box.append(s, btn('sign out', () => net.signOut()));
  });
}

function btn(text, fn, cls) {
  const b = document.createElement('button'); b.textContent = text; if (cls) b.className = cls;
  b.addEventListener('click', fn); return b;
}

// ---- writing ramps --------------------------------------------------------
let glide = 0, linked = true;
const recent = {};                                // input-key -> last time the admin touched it
const touched = k => { recent[k] = performance.now(); };
const busy = k => performance.now() - (recent[k] || 0) < 400;

// leading + trailing throttle per key so dragging doesn't flood the network
const thr = new Map();
function throttle(key, fn, ms = 60) {
  const e = thr.get(key);
  if (e) { e.fn = fn; return; }
  fn(); thr.set(key, { fn: null });
  const tick = () => { const e = thr.get(key); if (e.fn) { const f = e.fn; e.fn = null; f(); setTimeout(tick, ms); } else thr.delete(key); };
  setTimeout(tick, ms);
}

const cur = r => net.getState().roles[r];
const curPhase = r => phaseAt(cur(r), net.now());

function setTarget(role, to) {
  to = Math.max(0, Math.min(1, +to));
  throttle('t' + role, () => {
    const now = net.now(), r = cur(role);
    net.writeRole(role, { ...r, over: { ...r.over }, from: phaseAt(r, now), to, start: now, dur: glide * 1000 });
  });
}
function setProgress(t) { setTarget('cosi', t); if (linked) setTarget('cimsi', 1 - t); }
function hold(role) { const r = cur(role), p = curPhase(role); net.writeRole(role, { ...r, from: p, to: p, start: net.now(), dur: 0 }); }
function setRunning(role, running) { net.writeRole(role, { ...cur(role), running }); }
function setOverride(role, k, v) {
  throttle('o' + role, () => {
    const r = cur(role), over = { ...r.over };
    if (v == null) delete over[k]; else over[k] = v;
    net.writeRole(role, { ...r, over });
  });
}

// ---- master panel ---------------------------------------------------------
$('master').addEventListener('input', e => { touched('master'); setProgress(+e.target.value); });
$('linked').addEventListener('change', e => { linked = e.target.checked; $('masterBox').style.display = linked ? '' : 'none'; });
for (const v of [0, 0.25, 0.5, 0.75, 1]) $('jumps').append(btn('→ ' + v, () => { $('master').value = v; touched('master'); setProgress(v); }));
$('glide').addEventListener('input', e => { glide = Math.max(0, +e.target.value || 0); markGlide(); });
const glideBtns = [0, 2, 10, 30, 120, 300, 600].map(s => {
  const b = btn(s >= 60 ? s / 60 + 'm' : s + 's', () => { glide = s; $('glide').value = s; markGlide(); });
  b.dataset.s = s; $('glidePresets').append(b); return b;
});
function markGlide() { glideBtns.forEach(b => b.classList.toggle('on', +b.dataset.s === glide)); }
markGlide();

document.querySelectorAll('[data-all]').forEach(b => b.addEventListener('click', () => {
  const a = b.dataset.all;
  for (const r of ROLES) a === 'hold' ? hold(r) : setRunning(r, a === 'run');
}));
document.addEventListener('click', e => {
  const b = e.target.closest('[data-cmd]');
  if (!b) return;
  if (b.dataset.cmd === 'clear' && b.dataset.role === 'both' && !confirm('Clear every screen?')) return;
  net.sendCmd(b.dataset.cmd, b.dataset.role);
});

// ---- role cards -----------------------------------------------------------
const cards = {};
const dir = { cosi: '<span class="cold">cold</span> → <span class="warm">warm</span>', cimsi: '<span class="warm">warm</span> → <span class="cold">cold</span>' };
for (const role of ROLES) {
  const el = document.createElement('div');
  el.className = 'panel role';
  el.innerHTML = `
    <div class="row" style="justify-content:space-between"><h2>${ROLE_LABEL[role]}</h2><span class="muted">${dir[role]}</span></div>
    <div class="preview">
      <canvas></canvas>
      <div class="readout">
        <div>now <span class="big" data-now>0.00</span> <span class="muted" data-eta></span></div>
        <div class="bar"><i data-bar></i></div>
        <div class="muted">target <span data-tval>0.00</span></div>
        <input type="range" min="0" max="1" step="0.01" data-target>
        <div class="row" data-buttons></div>
      </div>
    </div>
    <details><summary>parameters (drag = lock value, ↺ = follow phase again)</summary><div data-params></div>
      <div class="row" style="margin-top:6px" data-pbuttons></div></details>`;
  $('roles').append(el);
  const q = s => el.querySelector(s);
  const c = cards[role] = {
    sim: createSim(q('canvas'), { cols: 36, rows: 64 }),
    now: q('[data-now]'), eta: q('[data-eta]'), bar: q('[data-bar]'), tval: q('[data-tval]'), target: q('[data-target]'),
    params: {},
  };
  c.target.addEventListener('input', () => {
    touched('t' + role);
    const v = +c.target.value;
    setTarget(role, v);
    if (linked) { const other = role === 'cosi' ? 'cimsi' : 'cosi'; setTarget(other, 1 - v); }
  });
  const bx = q('[data-buttons]');
  c.runBtn = btn('pause', () => setRunning(role, cur(role).running === false));
  bx.append(c.runBtn, btn('hold', () => hold(role)));
  for (const [cmd, label] of [['random', 'random'], ['seed', 'ice seed'], ['freeze', 'freeze'], ['melt', 'melt'], ['clear', 'clear']]) {
    const b = btn(label); b.dataset.cmd = cmd; b.dataset.role = role; bx.append(b);
  }
  const pbox = q('[data-params]');
  for (const k in PARAM_RANGES) {
    const [min, max, step] = PARAM_RANGES[k];
    const row = document.createElement('div'); row.className = 'param';
    row.innerHTML = `<span class="k">${k}</span><input type="range" min="${min}" max="${max}" step="${step}"><span class="v"></span>`;
    const input = row.querySelector('input'), out = row.querySelector('.v');
    input.addEventListener('input', () => { touched('p' + role + k); setOverride(role, k, clampParam(k, +input.value)); });
    row.append(btn('↺', () => setOverride(role, k, null)));
    pbox.append(row);
    c.params[k] = { row, input, out };
  }
  q('[data-pbuttons]').append(btn('↺ all follow phase', () => net.writeRole(role, { ...cur(role), over: {} })));
}

// ---- reflect shared state into the UI -------------------------------------
let lastCmdId = net.getState().cmd && net.getState().cmd.id;
net.on('state', st => {
  for (const role of ROLES) {
    const r = st.roles[role], c = cards[role];
    if (!c) continue;
    if (!busy('t' + role)) c.target.value = r.to;
    c.tval.textContent = (+r.to).toFixed(2);
    c.runBtn.textContent = r.running === false ? 'run' : 'pause';
    c.runBtn.classList.toggle('on', r.running === false);
    for (const k in c.params) c.params[k].row.classList.toggle('locked', r.over && r.over[k] != null);
  }
  if (!busy('master')) $('master').value = st.roles.cosi.to;
  const cmd = st.cmd;
  if (cmd && cmd.id !== lastCmdId) {
    lastCmdId = cmd.id;
    for (const role of ROLES) if (cmd.role === role || cmd.role === 'both') cards[role].sim.command(cmd.type);
  }
});

// ---- per-frame: previews and live readouts --------------------------------
let last = performance.now();
function frame(t) {
  const dt = (t - last) / 1000; last = t;
  const now = net.now();
  for (const role of ROLES) {
    const r = cur(role), c = cards[role], p = phaseAt(r, now), params = paramsFor(p, r.over);
    c.sim.setParams(params);
    if (r.running !== false) c.sim.tick(dt);
    c.sim.draw();
    c.now.textContent = p.toFixed(2);
    c.bar.style.width = (p * 100).toFixed(1) + '%';
    const left = r.dur > 0 ? Math.max(0, r.start + r.dur - now) / 1000 : 0;
    c.eta.textContent = left > 0 ? `gliding · ${left >= 60 ? Math.floor(left / 60) + 'm ' : ''}${Math.ceil(left % 60)}s left` : (r.running === false ? 'paused' : '');
    for (const k in c.params) {
      const { input, out } = c.params[k];
      if (!busy('p' + role + k)) input.value = params[k];
      out.textContent = Number(params[k].toFixed(3));
    }
  }
  $('masterVal').textContent = curPhase('cosi').toFixed(2);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA'].includes(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); const anyRunning = ROLES.some(r => cur(r).running !== false); ROLES.forEach(r => setRunning(r, !anyRunning)); }
  if (e.key === '[' || e.key === ']') {
    const v = Math.max(0, Math.min(1, +cur('cosi').to + (e.key === ']' ? 0.02 : -0.02)));
    $('master').value = v; setProgress(v);
  }
  if (e.key === 'h') ROLES.forEach(hold);
});
</script>
</body>
</html>
