<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lesson 04 · Interacting grids — Water / Words / Memory</title>
  <link rel="icon" type="image/png" href="../../favicon_1.png" />
  <meta name="robots" content="noindex" />
</head>
<body style="margin:0;background:#000">
<canvas id="cv"></canvas>
<script>
// Two grids now: `grid` (state: 0 empty, 1 liquid, 2 ice) and `temp`
// (temperature: 0 cold .. 1 hot, a Float32Array). Neither is stored inside
// the other -- update() for `grid` reads `temp` to modulate freeze/melt,
// and diffuseTemp() for `temp` doesn't look at `grid` at all. Two
// independent systems, one reading the other.
const CELL = 12;                                   // target pixels per cell
const W = Math.floor(innerWidth / CELL);
const H = Math.floor(innerHeight / CELL);
const cv = document.getElementById('cv');
cv.width = W; cv.height = H;
cv.style.touchAction = 'none';
const ctx = cv.getContext('2d');

function fit() {
  // largest size that keeps the grid's aspect ratio and fits in the window
  const scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width  = W * scale + 'px';
  cv.style.height = H * scale + 'px';
}
cv.style.imageRendering = 'pixelated';
cv.style.display = 'block';
fit();
addEventListener('resize', fit);

const EMPTY = 0, LIQUID = 1, ICE = 2;
const COLORS = [null, [40, 110, 255], [215, 238, 255]];   // indexed by state; EMPTY is temp-tinted instead
const COLD = [10, 20, 255], HOT = [270, 20, 20];            // empty-cell colour at temp 0 and temp 1

let grid = new Uint8Array(W * H);     // cell (x,y) lives at index y*W + x, value is its state
let temp = new Float32Array(W * H);   // same indexing, value is 0 (cold) .. 1 (hot)

function initTemp() {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) temp[y * W + x] = x / (W - 1);   // cold left, hot right
}
initTemp();

function randomize(density) {
  for (let i = 0; i < grid.length; i++) grid[i] = Math.random() < density ? LIQUID : EMPTY;
}

function draw() {
  const img = ctx.createImageData(W, H);
  for (let i = 0; i < grid.length; i++) {
    let r, g, b;
    if (grid[i] === EMPTY) {
      const t = temp[i];
      r = COLD[0] + (HOT[0] - COLD[0]) * t;
      g = COLD[1] + (HOT[1] - COLD[1]) * t;
      b = COLD[2] + (HOT[2] - COLD[2]) * t;
    } else {
      [r, g, b] = COLORS[grid[i]];
    }
    img.data[i * 4] = r; img.data[i * 4 + 1] = g; img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function paint(e) {
  const r = cv.getBoundingClientRect();
  const px = Math.floor((e.clientX - r.left) / r.width * W);
  const py = Math.floor((e.clientY - r.top) / r.height * H);
  if (px < 0 || px >= W || py < 0 || py >= H) return;
  const rad = params.brush;
  const heat = e.altKey, erase = !heat && ((e.buttons & 2) === 2 || e.button === 2);
  for (let dy = -rad; dy <= rad; dy++) for (let dx = -rad; dx <= rad; dx++) {
    if (dx * dx + dy * dy > rad * rad) continue;             // circular brush, like exercise4.html's
    const x = (px + dx + W) % W, y = (py + dy + H) % H;      // wrap at edges, same as the grids themselves
    const i = y * W + x;
    if (heat) temp[i] = Math.max(0, Math.min(1, temp[i] + (e.shiftKey ? -0.15 : 0.15)));
    else grid[i] = erase ? EMPTY : e.shiftKey ? ICE : LIQUID;
  }
  draw();
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); paint(e); });
cv.addEventListener('pointermove', e => { if (e.buttons) paint(e); });
cv.addEventListener('contextmenu', e => e.preventDefault());

randomize(0.3); draw();


let running = true, acc = 0, last = performance.now();


function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (running) {
    acc += dt * params.rate;
    while (acc >= 1) { grid = update(grid, temp); temp = diffuseTemp(temp); acc -= 1; }
    draw();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('keydown', e => {
  if (['TEXTAREA', 'INPUT'].includes(e.target.tagName)) return;
  if (e.code === 'Space') running = !running;
  if (e.key === 's') { grid = update(grid, temp); temp = diffuseTemp(temp); draw(); }       // single step
  if (e.key === 'ArrowUp')   { params.rate *= 1.25; showParams(); }
  if (e.key === 'ArrowDown') { params.rate /= 1.25; showParams(); }
  if (e.key === '[') setPhase(Math.max(0, phase - 0.02));
  if (e.key === ']') setPhase(Math.min(1, phase + 0.02));

  const k = keys[e.key];
  if (k) setParam(k[0], clampParam(k[0], +(params[k[0]] + k[1]).toFixed(3)));
});

// Tally of each state among the 8 (Moore) neighbours of (x,y). Counting
// matching states (not summing raw values) is what makes this work once a
// cell can be more than 0 or 1.
function neighbourCounts(g, x, y) {
  const counts = [0, 0, 0];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (dx === 0 && dy === 0) continue;
    counts[g[((y + dy + H) % H) * W + (x + dx + W) % W]]++;
  }
  return counts;
}

function update(g, temp) {
  const next = new Uint8Array(W * H);     // NEW array: never write into g
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, s = g[i];
    const [, nLiquid, nIce] = neighbourCounts(g, x, y);
    const nOccupied = nLiquid + nIce;      // liquid or ice both count as "occupied", like the old alive/dead count
    const t = temp[i];                     // 0 cold .. 1 hot -- reading the OTHER grid

    let next_s = s;
    if (s === EMPTY) {
      if (nLiquid >= params.birth_lo && nLiquid <= params.birth_hi) next_s = LIQUID;
    } else if (s === LIQUID) {
      if (nOccupied < params.surv_lo || nOccupied > params.surv_hi) next_s = EMPTY;
      // freeze chance shrinks as it gets hotter: full params.freeze when t=0, zero when t=1
      else if (nIce >= params.freeze_nb && Math.random() < params.freeze * (1 - t)) next_s = ICE;
    } else {   // s === ICE
      // melt chance grows as it gets hotter: zero when t=0, full params.melt when t=1
      if (nLiquid >= params.melt_nb && Math.random() < params.melt * t) next_s = LIQUID;
    }

    if (Math.random() < params.noise) {                 // pick a different state at random
      const others = [EMPTY, LIQUID, ICE].filter(v => v !== next_s);
      next_s = others[Math.floor(Math.random() * others.length)];
    }
    next[i] = next_s;
  }
  return next;
}

// Simple explicit diffusion: each cell moves part-way toward the average of
// its 4 (von Neumann) neighbours -- just up/down/left/right, not diagonals.
// Von Neumann is the standard stencil for diffusion/heat-spread; Moore (all
// 8, used above for counting states) is the standard for Life-like rules.
// Independent of `grid` entirely -- this is its own, separate automaton.
function diffuseTemp(t) {
  const next = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    const up    = t[((y - 1 + H) % H) * W + x];
    const down  = t[((y + 1) % H) * W + x];
    const left  = t[y * W + (x - 1 + W) % W];
    const right = t[y * W + (x + 1) % W];
    const avg = (up + down + left + right) / 4;
    next[i] = t[i] + params.diffuse * (avg - t[i]);
  }
  return next;
}

function placeIceSeed(size = 10) {
  const x0 = (W - size) >> 1, y0 = (H - size) >> 1;
  for (let y = y0; y < y0 + size; y++) for (let x = x0; x < x0 + size; x++)
    grid[((y + H) % H) * W + (x + W) % W] = ICE;
}

const sliders = {};
const params = {
  birth_lo: 3, birth_hi: 5, surv_lo: 2, surv_hi: 2,
  freeze: 0.3, freeze_nb: 3, melt: 0.05, melt_nb: 5,
  noise: 0.02, rate: 12.66, diffuse: 0.15, brush: 1,
};

const ranges = {                       // [min, max, step]
  birth_lo: [0, 8, 1], birth_hi: [0, 8, 1],
  surv_lo:  [0, 8, 1], surv_hi:  [0, 8, 1],
  freeze: [0, 1, 0.01], freeze_nb: [0, 8, 1],
  melt:   [0, 1, 0.01], melt_nb:   [0, 8, 1],
  noise: [0, 1, 0.001], rate: [1, 60, 0.5],
  diffuse: [0, 1, 0.01], brush: [0, 10, 1],
};

// --- phase: one knob driving every parameter above (except diffuse, brush) -
// Two complete presets, hand-picked to feel "frozen" and "liquid". Everything
// in between is a straight-line blend. birth_lo/birth_hi/surv_lo/surv_hi/
// freeze_nb/melt_nb are neighbour-count thresholds -- they only make sense as
// whole numbers, so they get rounded after blending. freeze/melt/noise/rate
// are continuous and are left as the raw blended value. `diffuse` and
// `brush` are left out of the blend on purpose -- properties of the
// temperature field and the UI brush, not of the state rules -- so they stay
// separate manual sliders.
const FROZEN = { 
  birth_lo: 4, birth_hi: 5, 
  surv_lo: 2, surv_hi: 3, 
  freeze: 0.9, freeze_nb: 1, 
  melt: 0.01, melt_nb: 8, 
  noise: 0.0, rate: 12 
};
const LIQUID_PRESET = { 
  birth_lo: 3, birth_hi: 5, 
  surv_lo: 2, surv_hi: 4, 
  freeze: 0.02, freeze_nb: 7, 
  melt: 0.4, melt_nb: 2, 
  noise: 0.00, rate: 22 
};
const INT_KEYS = new Set(['birth_lo', 'birth_hi', 'surv_lo', 'surv_hi', 'freeze_nb', 'melt_nb']);
const mix = (a, b, t) => a + (b - a) * t;

let phase = 0.5;
function setPhase(t) {
  phase = t;
  for (const k in FROZEN) {
    let v = mix(FROZEN[k], LIQUID_PRESET[k], t);
    if (INT_KEYS.has(k)) v = Math.round(v);           // staircase: see README
    params[k] = clampParam(k, +v.toFixed(3));
  }
  if (phaseInput) phaseInput.value = t;
  showParams();
}

function clampParam(name, v) {
  const [min, max] = ranges[name] || [0, Infinity];
  return Math.max(min, Math.min(max, v));
}

function setParam(name, v) {
  if (name in params) { params[name] = v; showParams(); }
}

const info = document.createElement('pre');
info.style.cssText = 'position:fixed;top:4px;right:8px;color:#8f8;margin:0;font:12px monospace';
document.body.appendChild(info);
function showParams() {
  info.textContent = `phase ${phase.toFixed(2)}\n` + JSON.stringify(params, null, 1);
  for (const k in sliders) {
    sliders[k].input.value = params[k];
    sliders[k].out.textContent = Number(params[k].toFixed(3));
  }
}
showParams();

const keys = {
  q: ['birth_lo', -1], w: ['birth_lo', 1],
  e: ['birth_hi', -1], r: ['birth_hi', 1],
  z: ['surv_lo',  -1], x: ['surv_lo',  1],
  c: ['surv_hi',  -1], v: ['surv_hi',  1],
  b: ['noise', -0.001], n: ['noise', 0.001],
};

const legend = document.createElement('pre');
legend.style.cssText = 'position:fixed;bottom:52px;left:8px;color:#8f8;margin:0;font:12px monospace;pointer-events:none';
document.body.appendChild(legend);

function buildLegend() {
  const by = {};                                   // group the two keys of each parameter
  for (const [key, [name, delta]] of Object.entries(keys)) {
    by[name] ??= {};
    by[name][delta < 0 ? 'dec' : 'inc'] = key;
  }
  const lines = Object.entries(by).map(([name, k]) => `${k.dec} / ${k.inc}   ${name}`);
  lines.push(
    '[ / ]   phase (frozen → liquid)',
    'up / down   rate', 'space   pause', 's   step', 'l   hide legend',
    'drag   paint liquid', 'shift+drag   paint ice', 'right-drag   erase',
    'alt+drag   heat', 'alt+shift+drag   cool', 'brush size: see controls panel'
  );
  legend.textContent = lines.join('\n');
}
buildLegend();

addEventListener('keydown', e => {
  if (e.key === 'l') legend.style.display = legend.style.display === 'none' ? '' : 'none';
});

// bottomDock holds two stacked pieces: the togglable per-parameter panel, and
// -- always visible, never hidden -- the phase bar. Because phaseBar is the
// last flex child, the panel opens *above* it instead of overlapping it.
const bottomDock = document.createElement('div');
bottomDock.style.cssText = 'position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column';
document.body.appendChild(bottomDock);

const panel = document.createElement('div');
panel.style.cssText = 'background:#000d;padding:8px 12px;' +
                      'font:13px monospace;color:#8f8;display:none;max-height:70vh;overflow-y:auto';
bottomDock.appendChild(panel);

const phaseBar = document.createElement('div');
phaseBar.style.cssText = 'display:flex;align-items:center;gap:8px;background:#000d;' +
                         'padding:8px 12px;font:13px monospace;color:#8f8;border-top:1px solid #353';
bottomDock.appendChild(phaseBar);

// phase isn't itself an entry in `params` -- it's a broadcaster that writes
// into several of them at once -- so it gets its own bar instead of a row
// inside the togglable panel.
let phaseInput;
{
  const label = document.createElement('span'); label.textContent = 'phase';
  phaseInput = document.createElement('input');
  Object.assign(phaseInput, { type: 'range', min: 0, max: 1, step: 0.01, value: phase });
  phaseInput.style.flex = '1';
  const out = document.createElement('span'); out.textContent = phase.toFixed(2);
  phaseInput.addEventListener('input', () => { setPhase(+phaseInput.value); out.textContent = phase.toFixed(2); });
  phaseBar.append(label, phaseInput, out);
}

for (const k in ranges) {
  const [min, max, step] = ranges[k];
  const row = document.createElement('div');
  row.style.cssText = 'display:grid;grid-template-columns:90px 1fr 50px;gap:8px;align-items:center;margin:6px 0';
  const label = document.createElement('span'); label.textContent = k;
  const input = document.createElement('input');
  Object.assign(input, { type: 'range', min, max, step });
  const out = document.createElement('span');
  input.addEventListener('input', () => setParam(k, +input.value));
  row.append(label, input, out);
  panel.appendChild(row);
  sliders[k] = { input, out };
}

function addButton(text, fn, parent = panel) {
  const b = document.createElement('button');
  b.textContent = text;
  b.style.cssText = 'font:14px monospace;padding:8px 12px;margin:4px 4px 0 0;background:#111;color:#8f8;border:1px solid #484;border-radius:4px';
  b.addEventListener('click', fn);
  parent.appendChild(b);
  return b;
}
addButton('pause / run', () => { running = !running; });
addButton('step',        () => { grid = update(grid, temp); temp = diffuseTemp(temp); draw(); });
addButton('random',      () => { randomize(0.3); draw(); });
addButton('clear',       () => { grid.fill(0); draw(); });
addButton('ice seed',    () => { placeIceSeed(); draw(); });
addButton('reset heat',  () => { initTemp(); draw(); });

const toggle = addButton('controls', () => {
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}, document.body);
toggle.style.cssText += ';position:fixed;top:4px;left:4px;opacity:0.7';

setPhase(phase);                       // fills params + all sliders from the phase=0.5 blend

if (matchMedia('(pointer: coarse)').matches) legend.style.display = 'none';   // no keys on touch
</script></body></html>
